services:
  watchdog-cn:
    build: .
    entrypoint: ["python", "metaforo_watchdog_cn.py"]
    volumes:
      - ./vote_result:/app/vote_result
    # Usage: docker-compose run watchdog-cn <url_or_id>

  watchdog-en:
    build: .
    entrypoint: ["python", "metaforo_watchdog_en.py"]
    volumes:
      - ./vote_result:/app/vote_result
    # Usage: docker-compose run watchdog-en <url_or_id>

  watchdog-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    volumes:
      - ./vote_result:/app/vote_result
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - PORT=5000
      - HOST=0.0.0.0
    # Usage: docker-compose up watchdog-web
    # Open http://localhost:5000 in your browser
